<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders Q&A</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow-x: auto; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Question about the orders</h1>
  <form id="ask-form">
    <input id="question" required>
    <button type="submit">Question</button>
  </form>
  <pre id="result">The response will appear here.</pre>

  <script>
    const form = document.getElementById("ask-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = document.getElementById("question").value;
      result.className = "";
      result.textContent = "Thinking...";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await response.json();
        if (!response.ok) result.className = "error";
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.className = "error";
        result.textContent = "Connection error: " + error;
      }
    });
  </script>
</body>
</html>
